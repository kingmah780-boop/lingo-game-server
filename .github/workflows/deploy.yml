این خط را پیدا کن:

uses: cloudflare/wrangler-action@v3

و به این تغییر بده:

uses: cloudflare/wrangler-action@v4

زیر apiToken و accountId هم این خط را اضافه کن:

wranglerVersion: "4"

این روش با مستندات رسمی Cloudflare هماهنگ است. 
