جایگزین کردن فایل در GitHub

۱. وارد پوشه .github/workflows شو.
۲. فایل قبلی deploy.yml را باز کن.
۳. روی مداد Edit بزن.
۴. تمام کد قبلی را پاک کن و محتوای فایل جدید را جایگزین کن.
۵. روی Commit changes بزن.

🔒 به Secretها دست نزن؛ همان‌هایی که قبلاً ساختی باقی بمانند.

بعد از جایگزینی، عکس بفرست تا اجرای جدید را بررسی کنیم.
deploy.ymlCode



    
  
name: Deploy Lingo Game Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy

